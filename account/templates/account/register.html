<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إنشاء حساب جديد | متجر الميكأب</title>
</head>
<body style="background-color: #f8f9fa; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div style="background: white; padding: 30px; border-radius: 12px; width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h2 style="color: #d63384; text-align: center;">إنشاء حساب عميلة جديد</h2>
        
        <!-- أضيفي هذا الجزء فوق <form> مباشرة -->
{% if error %}
    <p style="color: red; text-align: center; font-weight: bold;">{{ error }}</p>
{% endif %}

        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            <p>
                <label>اسم المستخدم:</label><br>
                <input type="text" name="username" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </p>
            <p>
                <label>كلمة المرور:</label><br>
                <input type="password" name="password" required style="width: 100%; padding: 8px; margin-top: 5px;">
            </p>
            <p>
                <label>رقم الهاتف:</label><br>
                <input type="text" name="phone" style="width: 100%; padding: 8px; margin-top: 5px;">
            </p>
            <p>
                <label>نوع البشرة:</label><br>
                <select name="skin_type" style="width: 100%; padding: 8px; margin-top: 5px;">
                    <option value="dry">جافة</option>
                    <option value="oily">دهنية</option>
                    <option value="combination">مختلطة</option>
                    <option value="normal">عادية</option>
                    <option value="sensitive">حساسة</option>
                </select>
            </p>
            <button type="submit" style="width: 100%; background: #d63384; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer;">إنشاء الحساب والتسجيل</button>
        </form>
    </div>
</body>
</html>
